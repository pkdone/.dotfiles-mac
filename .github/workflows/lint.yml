name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck on all .sh scripts
        run: |
          # Same runner as the pre-push hook. CI checks every script; the hook
          # checks only the .sh files changed versus the remote. ubuntu-latest
          # ships with shellcheck. Fish files are the fish-syntax job.
          shellcheck --version
          ./tests/run-all.sh --shellcheck all --no-tests

  brewfile:
    name: Brewfile (parses)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Brewfile parses
        run: |
          # `bundle list --all` evaluates the Brewfile's Ruby DSL and lists every
          # entry (brews, casks, taps, mas) without installing anything; malformed
          # syntax fails the job. Must run on macOS — casks/mas aren't valid on Linux.
          brew bundle list --all --file Brewfile

  fish-syntax:
    name: fish syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Syntax-check fish files
        run: |
          # `fish -n` parses without executing. config.fish references runtime
          # binaries (brew, mise, direnv, fzf) but -n never runs them, so this
          # is safe and needs nothing installed beyond fish itself.
          status=0
          while IFS= read -r f; do
            echo "checking $f"
            fish -n "$f" || status=1
          done < <(find . -type f -name '*.fish' -not -path './.git/*' | sort)
          exit "$status"

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          # Download the actionlint binary, then lint every workflow under
          # .github/workflows. shellcheck (preinstalled on the runner) is also
          # applied to the inline run: scripts as a bonus.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  shell-tests:
    name: shell unit tests (lib helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the shell unit tests
        run: |
          # tests/run-all.sh discovers tests/*.test.sh and runs them in parallel.
          # That includes manual-steps.test.sh, which checks that
          # docs/manual-steps.md matches scripts/render-manual-steps-doc.sh.
          # modes.test.sh needs Lua; without it that suite skips.
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 gcc >/dev/null
          ./tests/run-all.sh
          # Same suite with /Applications/Tailscale.app appearing present, so a
          # test that reads the host install fails here.
          ./tests/run-all.sh --tailscale installed

  mac-style-home:
    name: tests under a Mac-like home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite from a /Users home
        run: |
          # The unit tests run on Linux. A checkout whose path is a Mac home
          # used to pass here and fail locally. Copy the tree under
          # /Users/<name>/.dotfiles-mac-style, set HOME, and run the same
          # runner. The macOS runner is only used for the Brewfile job.
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 >/dev/null
          ./tests/run-all.sh --mac-home
