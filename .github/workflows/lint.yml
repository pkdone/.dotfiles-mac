name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run shellcheck on all .sh scripts
        run: |
          # Same runner as the pre-push hook. CI checks every script; the hook
          # checks only the .sh files changed versus the remote. ubuntu-latest
          # ships with shellcheck. Fish files are the fish-syntax job.
          shellcheck --version
          ./tests/run-all.sh --shellcheck all --no-tests

  brewfile:
    name: Brewfile (parses)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Brewfile parses
        run: |
          # `bundle list --all` evaluates the Brewfile's Ruby DSL and lists every
          # entry (brews, casks, taps, mas) without installing anything; malformed
          # syntax fails the job. Must run on macOS — casks/mas aren't valid on Linux.
          brew bundle list --all --file Brewfile

  fish-syntax:
    name: fish syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Syntax-check fish files
        run: |
          # `fish -n` parses without executing. config.fish references runtime
          # binaries (brew, mise, direnv, fzf) but -n never runs them, so this
          # is safe and needs nothing installed beyond fish itself.
          status=0
          while IFS= read -r f; do
            echo "checking $f"
            fish -n "$f" || status=1
          done < <(find . -type f -name '*.fish' -not -path './.git/*' | sort)
          exit "$status"

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        run: |
          # Pin v1.7.12. GitHub's release tarball sometimes comes back as a
          # 92-byte gateway error, which tar then rejects. Retry the download
          # and refuse any file whose sha256 is not the published checksum
          # before tar sees it. shellcheck on the runner still lints this script.
          set -euo pipefail
          version=1.7.12
          file="actionlint_${version}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${file}"
          sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          [ "$(uname -m)" = x86_64 ]
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ok=0
          attempt=1
          while [ "$attempt" -le 5 ]; do
            if curl -fsSL --retry 5 --retry-delay 2 -o "$tmp" "$url" \
              && printf '%s  %s\n' "$sum" "$tmp" | sha256sum -c -; then
              ok=1
              break
            fi
            echo "actionlint download attempt ${attempt} failed" >&2
            sleep "$attempt"
            attempt=$((attempt + 1))
          done
          [ "$ok" = 1 ]
          tar -xzf "$tmp" actionlint
          ./actionlint -color

  shell-tests:
    name: shell unit tests (lib helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the shell unit tests
        run: |
          # tests/run-all.sh discovers tests/*.test.sh and runs them in parallel.
          # That includes manual-steps.test.sh, which checks that
          # docs/manual-steps.md matches scripts/render-manual-steps-doc.sh.
          # external_slack and finder_hotkey specs need Lua; without it those suites skip.
          # fish runs the brewsync terminal test. `fish -n` alone does not.
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 gcc fish >/dev/null
          ./tests/run-all.sh
          # Same suite with /Applications/Tailscale.app appearing present, so a
          # test that reads the host install fails here.
          ./tests/run-all.sh --tailscale installed

  configured-mac:
    name: tests against a configured Mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite with configured-Mac stubs
        run: |
          # Stubs at the front of PATH answer the way a fully configured Mac
          # does (printer present, sleep already correct, a sample Shortcut
          # listed). A test that falls through to the inherited PATH gets ok
          # instead of "tool missing", which is the failure seen on a real
          # Mac, so it fails here too. lua5.4 is for the Hammerspoon specs. gcc builds
          # the Tailscale view used by the second run.
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 gcc fish >/dev/null
          ./tests/run-all.sh --configured-mac
          ./tests/run-all.sh --configured-mac --tailscale installed

  mac-style-home:
    name: tests under a Mac-like home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the suite from a /Users home
        run: |
          # The unit tests run on Linux. A checkout whose path is a Mac home
          # used to pass here and fail locally. Copy the tree under
          # /Users/<name>/.dotfiles-mac-style, set HOME, and run the same
          # runner. The macOS runner is only used for the Brewfile job.
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 fish >/dev/null
          ./tests/run-all.sh --mac-home
